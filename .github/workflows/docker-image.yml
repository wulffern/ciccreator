name: CI

on:
  push:
    branches: [ master ]
    #- The tests read json and tech files and compare against a reference
    #- cic. Without those paths a commit that changes the inputs or the
    #- reference cannot run the test that guards them, which is how
    #- tests/sun_sar9b came to sit red for over a year
    paths:
      - '**.cpp'
      - '**.h'
      - 'Makefile'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: wulffern/cic_qt:latest
      options: --user root
    steps:
    - name: ciccreator
      uses: actions/checkout@v2
    - name: Compile
      run: |
        pip install cicpy
        make compile
    - name: Test
      run: |
        make test
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: release
        path: |
          release/
          tests/
